<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Happy Physics Universe | كون الفيزياء السعيد</title>
  <meta name="description" content="Happy Physics Universe — six educational physics games: projectile motion, fluids, electromagnetic induction, circuits, optics and energy.">
  <meta name="theme-color" content="#2b1d6e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- fantasy backdrop: nebula colours, animated stars, floating planets and islands -->
  <div class="backdrop" aria-hidden="true">
    <div class="nebula"></div>
    <canvas id="sky"></canvas>
    <svg class="float planet" viewBox="0 0 120 120"><defs><radialGradient id="pl1" cx=".35" cy=".3"><stop offset="0" stop-color="#ffd1f0"/><stop offset=".6" stop-color="#c04bff"/><stop offset="1" stop-color="#5a19a8"/></radialGradient></defs><circle cx="60" cy="60" r="34" fill="url(#pl1)"/><ellipse cx="60" cy="62" rx="56" ry="13" fill="none" stroke="#ffd36b" stroke-width="5" transform="rotate(-18 60 62)"/></svg>
    <svg class="float moon" viewBox="0 0 100 100"><defs><radialGradient id="mn" cx=".4" cy=".35"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fe8ff"/></radialGradient></defs><circle cx="50" cy="50" r="30" fill="url(#mn)"/><circle cx="40" cy="42" r="6" fill="#c6f2ff"/><circle cx="60" cy="60" r="4" fill="#c6f2ff"/></svg>
    <svg class="float island one" viewBox="0 0 160 110"><path d="M10 40 Q80 22 150 40 Q120 100 80 106 Q40 100 10 40Z" fill="#6b4ad6"/><path d="M10 40 Q80 22 150 40 Q80 54 10 40Z" fill="#4be0a6"/><path d="M60 38 V14 M60 18 Q46 8 40 16 M60 18 Q74 6 82 14" stroke="#2fb985" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M104 34 l8 -22 8 22z" fill="#ffd36b"/></svg>
    <svg class="float island two" viewBox="0 0 160 110"><path d="M14 40 Q80 26 146 40 Q116 96 80 104 Q44 96 14 40Z" fill="#3d2a9e"/><path d="M14 40 Q80 26 146 40 Q80 52 14 40Z" fill="#ff8fd8"/><path d="M80 36 l10 -26 10 26z" fill="#3ef0ff" stroke="#fff" stroke-width="2"/></svg>
  </div>
  <div id="app">
    <section id="screen-welcome" class="screen" aria-label="Welcome"></section>
    <section id="screen-home" class="screen" aria-label="Home"></section>
    <section id="screen-rate" class="screen" aria-label="Rating"></section>
    <section id="screen-game" class="screen" aria-label="Game">
      <header class="game-top">
        <button class="icon-btn" id="g-back" aria-label="Back">⟵</button>
        <div class="game-top-title">
          <strong id="g-title"></strong>
          <span id="g-sub"></span>
        </div>
        <div class="game-top-actions">
          <button class="icon-btn" id="g-help" aria-label="Help">?</button>
          <button class="icon-btn" id="g-restart" aria-label="Restart">↻</button>
        </div>
      </header>
      <div class="game-body">
        <div class="stage-wrap">
          <canvas id="stage" dir="ltr" tabindex="0" aria-label="Game canvas"></canvas>
          <div class="stage-hint" id="g-hint" aria-live="polite"></div>
          <div class="stage-banner" id="g-banner"></div>
          <div class="stage-card" id="g-card" hidden></div>
        </div>
        <aside class="sci-panel" aria-label="Physics panel">
          <section class="sci-block">
            <h3 data-i18n="panel.controls"></h3>
            <div id="g-controls" class="controls"></div>
          </section>
          <section class="sci-block">
            <h3 data-i18n="panel.live"></h3>
            <table id="g-vars" class="vars"></table>
          </section>
          <section class="sci-block">
            <h3 data-i18n="panel.equations"></h3>
            <div id="g-formulas" class="formulas"></div>
          </section>
          <section class="sci-block">
            <h3 data-i18n="panel.terms"></h3>
            <div id="g-terms" class="terms"></div>
          </section>
        </aside>
      </div>
    </section>
  </div>
  <div id="wipe" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="boot-error" hidden style="position:fixed;inset:auto 12px 12px 12px;z-index:99;background:#fff;color:#241a4f;border-radius:16px;padding:12px 14px;font:600 14px/1.5 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);direction:rtl"></div>
  <script>
    // Older Safari support + a visible message instead of a blank page if anything fails to start.
    if (!Array.prototype.at) {
      Object.defineProperty(Array.prototype, 'at', { configurable: true, writable: true, value: function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; } });
    }
    window.__bootError = function (msg) {
      var el = document.getElementById('boot-error');
      el.hidden = false;
      el.textContent = 'تعذّر تشغيل اللعبة على هذا المتصفح. حدّث نظام الجهاز أو المتصفح ثم أعد المحاولة. (' + msg + ')';
    };
    window.addEventListener('error', function (e) { if (!window.__booted) window.__bootError((e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
    window.addEventListener('unhandledrejection', function (e) { if (!window.__booted) window.__bootError(String(e.reason)); });
    setTimeout(function () { if (!window.__booted) window.__bootError('timeout'); }, 8000);
  </script>
  <script nomodule>window.__bootError('ES modules not supported');</script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
